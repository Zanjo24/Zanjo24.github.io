<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonies</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">My Portfolio</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'home' %}">Home</a>
                <a class="nav-link active" href="{% url 'testimony_list' %}">Testimonies</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold m-0">Testimonies</h2>
                    <a href="{% url 'add_testimony' %}" class="btn btn-primary shadow-sm">+ Add Testimony</a>
                </div>

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4">
                        {% if testimonies %}
                            <div class="list-group list-group-flush">
                                {% for testimony in testimonies %}
                                    <a href="{% url 'testimony_detail' testimony.pk %}" class="list-group-item list-group-item-action py-3">
                                        <div class="d-flex w-100 justify-content-between">
                                            <h5 class="mb-1 fw-bold text-dark">{{ testimony.name }}</h5>
                                            <small class="text-muted">{{ testimony.created_at|date:"M d, Y" }}</small>
                                        </div>
                                        <p class="mb-1 text-secondary text-truncate">{{ testimony.body }}</p>
                                    </a>
                                {% endfor %}
                            </div>
                        {% else %}
                            <div class="text-center py-5">
                                <p class="text-muted mb-3">No testimonies yet.</p>
                                <a href="{% url 'add_testimony' %}" class="btn btn-outline-primary btn-sm">Be the first to add one!</a>
                            </div>
                        {% endif %}
                    </div>
                </div>

                <div class="mt-4 text-center">
                    <a href="{% url 'home' %}" class="text-decoration-none text-secondary">&larr; Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
